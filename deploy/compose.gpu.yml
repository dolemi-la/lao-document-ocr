services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.owned-api
      args:
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-}"
        INSTALL_S3: "${INSTALL_S3:-false}"
    environment:
      OCR_ENGINE: owned
      OCR_DEVICE: "${OCR_DEVICE:-cuda}"
      OCR_DECODER: "${OCR_DECODER:-greedy}"
      OCR_BEAM_WIDTH: "${OCR_BEAM_WIDTH:-10}"
      OCR_MODEL_PATH: /models/recognizer.pt2
      OCR_CALIBRATION_PATH: "${OCR_CALIBRATION_PATH:-}"
      OCR_LAYOUT_DETECTOR: "${OCR_LAYOUT_DETECTOR:-morphology}"
      OCR_LAYOUT_MODEL_PATH: "${OCR_LAYOUT_MODEL_PATH:-}"
      OCR_LAYOUT_CONFIDENCE: "${OCR_LAYOUT_CONFIDENCE:-0.55}"
      OCR_READING_ORDER: "${OCR_READING_ORDER:-deterministic}"
      OCR_READING_ORDER_MODEL_PATH: "${OCR_READING_ORDER_MODEL_PATH:-}"
      OCR_READING_ORDER_MAX_BLOCKS: "${OCR_READING_ORDER_MAX_BLOCKS:-256}"
      JOB_MAX_WORKERS: "${GPU_JOB_MAX_WORKERS:-1}"
      JOB_MAX_ACTIVE: "${GPU_JOB_MAX_ACTIVE:-4}"
    volumes:
      - "${OCR_MODEL_DIR:-./models}:/models:ro"
    gpus: all
