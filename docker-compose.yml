services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OCR_LANGUAGES: lao+eng
      OCR_PSM: "3"
      MAX_PAGES: "60"
      MAX_UPLOAD_BYTES: "26214400"
      CORS_ORIGINS: http://localhost:5173
      JOB_MAX_WORKERS: "2"
      JOB_MAX_ACTIVE: "8"
      JOB_RETENTION_SECONDS: "3600"
      BATCH_MAX_FILES: "${BATCH_MAX_FILES:-10}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-0}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_MAX_CLIENTS: "${RATE_LIMIT_MAX_CLIENTS:-10000}"
      RATE_LIMIT_TRUST_PROXY_HEADERS: "${RATE_LIMIT_TRUST_PROXY_HEADERS:-false}"
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

  trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - .:/workspace
    working_dir: /workspace
