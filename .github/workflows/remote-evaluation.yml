name: Remote Scan Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Remote source-registry ID to evaluate"
        required: true
        type: string
      page:
        description: "Optional 1-based page number; leave blank for representative sampling"
        required: false
        type: string
      max_source_mb:
        description: "Maximum remote download size in MiB"
        required: true
        default: "25"
        type: string
      auto_orient_right_angles:
        description: "Opt in to conservative right-angle auto-orientation"
        required: true
        default: false
        type: boolean
      diagnostic_rotation_probes:
        description: "Run exhaustive diagnostic 0/90/180/270 OCR probes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  remote-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract Lao/English
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             tesseract-ocr             tesseract-ocr-lao             tesseract-ocr-eng
          tesseract --list-langs

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run remote diagnostic
        id: diagnostic
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          PAGE: ${{ inputs.page }}
          MAX_SOURCE_MB: ${{ inputs.max_source_mb }}
          AUTO_ORIENT: ${{ inputs.auto_orient_right_angles }}
          ROTATION_PROBES: ${{ inputs.diagnostic_rotation_probes }}
          REPORT: ${{ runner.temp }}/remote-source-diagnostic.json
        run: |
          set -euo pipefail
          args=(
            lao-ocr evaluate-remote-sources
            --registry benchmarks/source-registry.json
            --source-id "$SOURCE_ID"
            --max-pages-per-source 3
            --max-source-mb "$MAX_SOURCE_MB"
            --output "$REPORT"
          )
          if [ -n "$PAGE" ]; then
            case "$PAGE" in
              *[!0-9]*|'')
                echo "page input must be a positive integer" >&2
                exit 2
                ;;
            esac
            if [ "$PAGE" -lt 1 ]; then
              echo "page input must be at least 1" >&2
              exit 2
            fi
            args+=(--page "$PAGE")
          fi
          if [ "$AUTO_ORIENT" = "true" ]; then
            args+=(--auto-orient-right-angles)
          fi
          if [ "$ROTATION_PROBES" = "true" ]; then
            args+=(--rotation-probes)
          fi
          set +e
          "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify report privacy boundary
        env:
          REPORT: ${{ runner.temp }}/remote-source-diagnostic.json
          EXPECTED_AUTO_ORIENT: ${{ inputs.auto_orient_right_angles }}
          EXPECTED_ROTATION_PROBES: ${{ inputs.diagnostic_rotation_probes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT"])
          payload = json.loads(path.read_text(encoding="utf-8"))

          assert payload["report_type"] == "remote-source-diagnostic"
          assert payload["not_benchmark_accuracy"] is True
          assert payload["summary"]["sources"] == 1
          expected_auto_orient = os.environ["EXPECTED_AUTO_ORIENT"].lower() == "true"
          assert payload["selection"]["auto_orient_right_angles"] is expected_auto_orient
          expected_rotation_probes = (
              os.environ["EXPECTED_ROTATION_PROBES"].lower() == "true"
          )
          assert (
              payload["selection"]["probe_right_angle_rotations"]
              is expected_rotation_probes
          )

          forbidden = {
              "reference",
              "hypothesis",
              "ground_truth",
              "ocr_text",
              "native_text_content",
          }

          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      assert key not in forbidden, key
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(payload)
          print(json.dumps(payload["summary"], indent=2))
          PY

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v7
        with:
          name: remote-source-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/remote-source-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail when diagnostic source failed
        if: steps.diagnostic.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          echo "Remote diagnostic command exited with $EXIT_CODE" >&2
          exit "$EXIT_CODE"

