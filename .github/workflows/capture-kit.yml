name: Build Collector Capture Kit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare pinned Phetsarath OT v4.103
        run: |
          set -euo pipefail
          FONT_DIR="$RUNNER_TEMP/PhetsarathOT-v4.103"
          FONT_ZIP="$RUNNER_TEMP/PhetsarathOT-v4.103.zip"
          curl -L --fail --silent --show-error             https://phetsarath.mts.la/downloads/PhetsarathOT-v4.103.zip             -o "$FONT_ZIP"
          echo "a97a317eb1e95c5338a38233176189f63e5b23f29a19630ec317aedee0ce8381  $FONT_ZIP"             | sha256sum -c -
          rm -rf "$FONT_DIR"
          mkdir -p "$FONT_DIR"
          unzip -q "$FONT_ZIP" -d "$FONT_DIR"
          echo "8dd0fa55de186b051433255d80217007b4026dfc38e2781659424ad7058bbd6e  $FONT_DIR/PhetsarathOT-Regular.ttf"             | sha256sum -c -


      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build canonical suite and collector kit
        env:
          OUTPUT_DIR: ${{ runner.temp }}/project-authored-lao-v1
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"

          lao-ocr generate-capture-suite \
            --corpus resources/corpora/project-authored-lao-v1.txt \
            --output "$OUTPUT_DIR/suite" \
            --font "$RUNNER_TEMP/PhetsarathOT-v4.103/PhetsarathOT-Regular.ttf" \
            --suite-id project-authored-lao-v1 \
            --text-license Apache-2.0 \
            --text-provenance "Project-authored Lao capture corpus v1; resources/corpora/project-authored-lao-v1.meta.json" \
            --dpi 150 \
            --lines-per-page 8 \
            --max-pages-per-template 10 \
            --require-complete-font

          lao-ocr build-capture-kit \
            --suite-manifest "$OUTPUT_DIR/suite/capture-suite.json" \
            --output "$OUTPUT_DIR/project-authored-lao-v1.collector.zip" \
            --revision "$REVISION"

      - name: Verify collector artifact
        env:
          OUTPUT_DIR: ${{ runner.temp }}/project-authored-lao-v1
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          import pymupdf

          root = Path(os.environ["OUTPUT_DIR"])
          suite_path = root / "suite" / "capture-suite.json"
          suite = json.loads(suite_path.read_text(encoding="utf-8"))
          worksheet_path = root / "suite" / suite["worksheet"]
          rows = list(
              csv.DictReader(
                  worksheet_path.open(encoding="utf-8", newline="")
              )
          )
          pdf_path = root / "suite" / suite["combined_pdf"]
          pdf = pymupdf.open(pdf_path)
          try:
              page_count = pdf.page_count
          finally:
              pdf.close()

          expected_pages = sum(
              int(pack["page_count"])
              for pack in suite["packs"]
          )
          assert page_count == expected_pages == len(rows) == 60

          kit_path = root / "project-authored-lao-v1.collector.zip"
          with zipfile.ZipFile(kit_path) as archive:
              expected_members = {
                  "CAPTURE-INSTRUCTIONS.md",
                  "SHA256SUMS",
                  "capture-kit.json",
                  "capture-worksheet.csv",
                  "project-authored-lao-v1.pdf",
              }
              assert set(archive.namelist()) == expected_members

              collector_sheet = archive.read(
                  "capture-worksheet.csv"
              ).decode("utf-8")
              assert "ground_truth" not in collector_sheet
              assert "digital_page" not in collector_sheet
              assert "pack_manifest" not in collector_sheet

              manifest = json.loads(
                  archive.read("capture-kit.json")
              )
              assert manifest["page_count"] == 60
              assert manifest["font"] == "PhetsarathOT-Regular.ttf"
              assert manifest["excludes_ground_truth"] is True
              assert manifest["excludes_digital_page_images"] is True
              assert manifest["excludes_internal_suite_paths"] is True

              for line in archive.read("SHA256SUMS").decode("utf-8").splitlines():
                  digest, name = line.split("  ", 1)
                  assert digest == hashlib.sha256(
                      archive.read(name)
                  ).hexdigest()

          digest = hashlib.sha256(kit_path.read_bytes()).hexdigest()
          checksum_path = root / "project-authored-lao-v1.collector.zip.sha256"
          checksum_path.write_text(
              f"{digest}  {kit_path.name}\n",
              encoding="utf-8",
          )
          print(f"Collector kit SHA-256: {digest}")
          PY

      - name: Upload collector kit
        uses: actions/upload-artifact@v7
        with:
          name: project-authored-lao-v1-collector-${{ github.sha }}
          path: |
            ${{ runner.temp }}/project-authored-lao-v1/project-authored-lao-v1.collector.zip
            ${{ runner.temp }}/project-authored-lao-v1/project-authored-lao-v1.collector.zip.sha256
          if-no-files-found: error
          retention-days: 30
