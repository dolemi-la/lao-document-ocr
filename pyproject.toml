[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lao-document-ocr"
version = "0.1.0"
description = "Open-source Lao-first document OCR with editable DOCX export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lao Document OCR contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic>=2.9,<3",
  "Pillow>=12.3,<13",
  "PyMuPDF>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.0,<3",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
]

[project.scripts]
lao-ocr = "lao_document_ocr.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]
train = [
  "torch>=2.5,<3",
]
s3 = [
  "boto3>=1.35,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lao_document_ocr"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
